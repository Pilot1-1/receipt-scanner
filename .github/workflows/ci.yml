name: CI

# Checks every push and pull request. Nothing here talks to AWS or Gemini: no secrets are needed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as the Lambda runtime
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -v

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
      - name: Format
        run: terraform fmt -check -recursive -diff
        working-directory: terraform
      - name: Validate main configuration
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate bootstrap (remote state bucket)
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
