<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b3fd4'/%3E%3Cpath d='M9 7h14v18l-3.5-2.4L16 25l-3.5-2.4L9 25z' fill='%23fff'/%3E%3Cpath d='M12.5 12h7M12.5 16h7' stroke='%232b3fd4' stroke-width='1.6'/%3E%3C/svg%3E" />
    <title>Receipt Scanner</title>
    <script>
      // Set the theme before the first paint (no white flash for people who use the dark one).
      // Keep this in step with src/lib/theme.js: "light" / "dark" are saved choices, no value means "auto".
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved === "dark" || (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
